<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Quotes App</title>
    <!-- Linked to Member 2's CSS file -->
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>

    <!-- Navigation back to Portfolio -->
    <header class="app-header">
        <nav>
            <a href="index.html" class="back-link">&larr; Back to Portfolio Homepage</a>
        </nav>
    </header>

    <main class="app-main">
        <div class="app-container">
            <h1>Anime Life Quotes</h1>
            <p class="app-subtitle">Click the button below to generate a new anime quote.</p>

            <!-- Main Workspace Grid (Quote Box + Anime Graphic Side Slot) -->
            <div class="workspace-layout">
                
                <!-- Quote Display Box -->
                <div class="quote-box">
                    <span class="quote-symbol">“</span>
                    <!-- Member 3's JavaScript will target these IDs -->
                    <p id="quote">Loading inspiration...</p>
                    <p id="author" class="author"></p>
                    
                    <!-- Action Buttons Toolbar -->
                    <div class="action-buttons-container">
                        <button id="btn" class="generate-btn">New Quote</button>
                        <!-- Copy and Share Buttons for JavaScript integration -->
                        <button id="copy-btn" class="secondary-btn">Copy</button>
                        <button id="share-btn" class="secondary-btn">Share</button>
                    </div>
                </div>


            </div>
        </div>
    </main>

    <footer>
        <p>Powered by Public API &bull; Built with HTML, CSS, & JavaScript</p>
    </footer>

    <!-- Linked to Member 3's JavaScript file -->
</body>
</html>
